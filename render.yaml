# Blueprint Render — Backend LARIA con MongoDB Atlas + Redis (Upstash).
# Persistencia: DB_PROVIDER=mongodb (MongoDB Atlas M0 free tier).
# Redis: Upstash (free tier) para rate-limit + cache.
# Dashboard: New → Blueprint → este repo → render.yaml
# Docs: backend/docs/deploy-render.md

services:
  - type: web
    # Backend LARIA con MongoDB Atlas (persistente) + Redis Upstash (rate-limit/cache).
    name: laria-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: "sh -c 'uvicorn src.main:app --host 0.0.0.0 --port $PORT'"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LARIA_DEPLOY_TIER
        value: atlas
      # Producción desde el 19-oct-2026: el arranque exige (fail-fast)
      # EVENT_BUS_BACKEND=outbox, redis en cache+rate y docs off.
      - key: APP_ENV
        value: production
      - key: DB_PROVIDER
        value: mongodb
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: laria_db
      # 3 s (default local) se quedan cortos contra Atlas en frío: SRV + TLS.
      - key: MONGODB_TIMEOUT_MS
        value: "10000"
      - key: RATE_LIMIT_BACKEND
        value: redis
      # Outbox: la evidencia sobrevive a reinicios. El worker reclama con lease
      # (ADR-010), así que es seguro con más de una réplica.
      - key: EVENT_BUS_BACKEND
        value: outbox
      - key: CACHE_BACKEND
        value: redis
      - key: REDIS_URL
        sync: false
      # Archivos originales fuera de Atlas (512 MB en M0). Los secretos de R2
      # se rellenan en el dashboard (sync: false); no van en este archivo.
      - key: ORIGINAL_STORAGE
        value: r2
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: DOCUMENT_MAX_UPLOAD_BYTES
        value: "26214400"
      - key: IA_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_MODEL_DEFAULT
        value: gpt-4o-mini
      - key: DEBUG
        value: "false"
      # Swagger público enseñaba el mapa completo de la API. Para usarlo en
      # desarrollo, local; en Render solo si se reactiva a propósito un momento.
      - key: ENABLE_DOCS
        value: "false"
      # Pero /docs sigue disponible con usuario "laria" y esta contraseña
      # (se genera sola; se ve en el panel de Render → Environment).
      - key: DOCS_PASSWORD
        generateValue: true
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: text
      - key: METRICS_ENABLED
        value: "true"
      # /metrics exige `Authorization: Bearer <METRICS_TOKEN>` (valor en el panel).
      - key: METRICS_TOKEN
        generateValue: true
      # Client ID de OAuth (Google Cloud Console). Vacío = botón de Google apagado.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Clerk. Los valores se rellenan en el panel (sync: false); no van en git.
      # La pública también se acepta como NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY.
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Frontend API de la instancia (el `iss` de los tokens). No es secreta.
      - key: CLERK_ISSUER
        value: https://glorious-bluejay-3695.clerk.accounts.dev
      # Transición (ADR-027): acepta el JWT propio y el de Clerk. Cuando el
      # frontend con Clerk esté probado en producción → "clerk".
      - key: AUTH_MODE
        value: both
      # Voz del tutor (ADR-026): cada audio es gasto en OpenAI.
      - key: TTS_ENABLED
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Generada por Render (no la subas a git).
      - key: SECRET_KEY
        generateValue: true
      # La pones tú en el dashboard al crear el Blueprint (sync: false).
      - key: OPENAI_API_KEY
        sync: false
      # localhost:3000 es el frontend en local (next dev) contra esta API. Sin
      # credenciales (el token va en Authorization), así que no expone nada.
      - key: CORS_ORIGINS
        value: '["https://laria-frontend.vercel.app","http://localhost:3000","http://localhost:4321"]'
      # Vistas previas de Vercel de los PRs del frontend: cada una tiene su URL.
      # Se valida al arrancar; un patrón que deje pasar orígenes ajenos no arranca.
      - key: CORS_ORIGIN_REGEX
        value: '^https://laria-[a-z0-9-]+-ricardoalfredoaguilar1-gmailcoms-projects\.vercel\.app$'
